<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Whiskerfolk Mochi icon</title>
<desc id="desc">Mochi peeking from a warm cardboard box against a deep rain-blue background.</desc>
<defs>
  <radialGradient id="bg" cx="42%" cy="28%" r="86%">
    <stop offset="0" stop-color="#446372"/>
    <stop offset=".58" stop-color="#273B49"/>
    <stop offset="1" stop-color="#17272F"/>
  </radialGradient>
  <linearGradient id="box" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#B08359"/>
    <stop offset="1" stop-color="#79583A"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#10191D" flood-opacity=".34"/>
  </filter>
</defs>
<rect width="512" height="512" rx="116" fill="url(#bg)"/>
<circle cx="382" cy="108" r="104" fill="#AFC8B4" opacity=".09"/>
<path d="M32 102 490 25M-8 184 466 105M56 222 520 144" stroke="#D8E6EA" stroke-width="4" stroke-linecap="round" opacity=".14"/>

<!-- ears -->
<path d="M145 222 167 105 229 196Z" fill="#F7EEDF"/>
<path d="M282 194 354 99 368 229Z" fill="#C58A5D"/>
<path d="M160 190 171 135 207 190Z" fill="#DDB9A7"/>
<path d="M308 184 348 128 356 198Z" fill="#D7A483"/>

<!-- head -->
<ellipse cx="258" cy="232" rx="129" ry="119" fill="#FBF5E8" filter="url(#shadow)"/>
<!-- caramel comma -->
<path d="M321 169c37 6 43 42 24 61-10 10-25 10-39 4 15-10 14-30-1-42 2-10 7-18 16-23Z" fill="#C58A5D"/>

<!-- eyes -->
<ellipse cx="213" cy="234" rx="17" ry="24" fill="#456049"/>
<ellipse cx="305" cy="234" rx="17" ry="24" fill="#456049"/>
<ellipse cx="207" cy="227" rx="5" ry="7" fill="#fff" opacity=".92"/>
<ellipse cx="299" cy="227" rx="5" ry="7" fill="#fff" opacity=".92"/>
<!-- nose -->
<path d="M250 274c6-6 16-6 22 0-2 10-8 14-11 14s-9-4-11-14Z" fill="#9F6C65"/>
<path d="M261 287v12" stroke="#655850" stroke-width="5" stroke-linecap="round"/>
<path d="M261 299c-9 8-17 8-24 2M261 299c9 8 17 8 24 2" fill="none" stroke="#655850" stroke-width="4" stroke-linecap="round"/>

<!-- whiskers -->
<path d="M206 276 112 258M204 289l-96 8M312 276l94-18M314 289l96 8" stroke="#71655D" stroke-width="4" stroke-linecap="round" opacity=".66"/>

<!-- box -->
<g filter="url(#shadow)">
  <path d="M80 327 438 314 420 469 95 475Z" fill="url(#box)"/>
  <path d="m88 336 145-62 40 72-175 45Z" fill="#BB8E62"/>
  <path d="m426 322-139-53-30 75 164 35Z" fill="#A77A50"/>
  <path d="M94 378c92-15 222-16 332-6" fill="none" stroke="#68482F" stroke-width="6" opacity=".28"/>
</g>
<!-- paws on edge -->
<ellipse cx="197" cy="352" rx="38" ry="25" fill="#F7EEDF"/>
<ellipse cx="309" cy="350" rx="38" ry="25" fill="#F7EEDF"/>
<path d="M184 350v10M197 347v12M296 347v12M310 345v12" stroke="#D9CABA" stroke-width="3" stroke-linecap="round"/>

<!-- subtle whiskerfolk W notch -->
<path d="M215 440 230 457l18-25 18 25 18-17" fill="none" stroke="#EBD9BE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
</svg>